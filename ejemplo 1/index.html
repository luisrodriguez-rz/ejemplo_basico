<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
<div class="container">
<div class="row g-0">
  <div class="md:col-6 vstack gap-3 p-4 bg-body fg-body" data-bs-theme="light">
    <h6 class="fw-semibold">Light mode</h6>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Card title</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
      </div>
    </div>
    <div class="alert theme-primary"><p>This is a primary alert.</p></div>
    <input type="text" class="form-control" placeholder="Form control">
    <div class="form-field">
      <input type="checkbox" id="checkLabel" class="check" />
      <label for="checkLabel">Example new checkbox</label>
    </div>
    <div class="vstack gap-2">
      <button type="button" class="btn-subtle theme-accent theme-primary btn-subtle rounded-pill">Primary</button>
      <button type="button" class="btn-subtle theme-accent theme-primary btn-subtle rounded-pill">Secondary</button>
    </div>
  </div>
</div>
</div>

<div class="container mt-5">
    <h1 class="text-center">Hello, Bootstrap!</h1>
    <p class="text-center">This is a simple example of using Bootstrap in a HTML file.</p>
    <div class="text-center">
        <button class="btn btn-primary">Click Me</button>
    </div>
<script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
